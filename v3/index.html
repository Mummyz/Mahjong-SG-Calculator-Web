<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- /v3/ WAS THE APP. It is the root now, and this page only forwards.

     Kept forever rather than deleted: /v3/ was the preview address for four
     runs, so it is in bookmarks, in the owner's review notes and in every
     report written before the promotion. A 404 there would be a broken link
     to the product's own front door.

     Three mechanisms, because GitHub Pages serves static files and cannot
     issue a real 301: the canonical link tells crawlers where the page lives,
     the refresh forwards a browser with JavaScript off, and the script
     REPLACES the history entry so Back does not bounce the player straight
     back here. -->
<link rel="canonical" href="https://mahjongyuk.com/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=/">
<title>Mahjongyuk — Mahjong Calculator</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    padding: 24px; text-align: center;
    font: 400 16px/1.6 "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
    background: #FFEEDC; color: #13241E;
  }
  @media (prefers-color-scheme: dark) { body { background: #13241E; color: #EAF2EC; } }
  img { width: 168px; height: auto; margin-bottom: 8px; }
  a { color: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/brand/logo-mahjongyuk.png" alt="Mahjongyuk" width="560" height="511">
  <p>Mahjongyuk has moved to <a href="/">mahjongyuk.com</a>.</p>
</main>
<script>
  // replace(), not assign(): the player pressed Back to leave the app, and
  // an extra history entry here would send them forward into it again.
  location.replace('/')
</script>
</body>
</html>
