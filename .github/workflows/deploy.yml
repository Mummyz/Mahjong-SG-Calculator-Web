name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for mahjongyuk.com.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # FOUR THINGS MUST HOLD ON EVERY DEPLOY, and they changed at v3.0.0.
      #   1. the CNAME file is sacred - without it the domain breaks
      #   2. /v1/ serves the legacy calculator byte-for-byte, forever
      #   3. the ROOT is the app now, and it must load a bundle of its own
      #   4. /v3/ answers, and forwards to the root rather than serving a
      #      second copy of the app at a second URL
      # The guards that pinned the OLD root - its source manifest and its
      # string hash - are gone with the app they protected. See the note at
      # the top of src/test/scaffold.test.ts.
      - name: Verify deploy artifact
        run: |
          set -e
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing"; exit 1; }
          [ "$(tr -d '[:space:]' < dist/CNAME)" = "mahjongyuk.com" ] \
            || { echo "::error::dist/CNAME is not mahjongyuk.com"; exit 1; }

          cmp public/v1/index.html dist/v1/index.html \
            || { echo "::error::/v1/ no longer matches the legacy calculator"; exit 1; }

          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          BUNDLE=$(grep -o 'src="/assets/[^"]*\.js"' dist/index.html | head -1 | sed 's|src="||;s|"||')
          [ -n "$BUNDLE" ] \
            || { echo "::error::the root page references no JS bundle - the app did not build"; exit 1; }
          test -f "dist${BUNDLE}" \
            || { echo "::error::the root page references ${BUNDLE}, which is not in the build"; exit 1; }

          # /v3/ FORWARDS. It must exist, because it was the address for four
          # runs and is in bookmarks - and it must NOT boot the app again.
          test -f dist/v3/index.html \
            || { echo "::error::/v3/ is missing - old bookmarks would 404"; exit 1; }
          grep -q 'http-equiv="refresh"' dist/v3/index.html \
            || { echo "::error::/v3/ does not forward to the root"; exit 1; }
          grep -q "location.replace('/')" dist/v3/index.html \
            || { echo "::error::/v3/ has no scripted forward"; exit 1; }
          grep -q 'src="/assets/' dist/v3/index.html \
            && { echo "::error::/v3/ is serving a bundle - it must only forward"; exit 1; }

          # The retired surfaces must not come back in a build.
          test -e dist/app \
            && { echo "::error::the /app/ harness was retired but still ships"; exit 1; }

          # Run 5. The front door IS the logo - if the asset does not ship,
          # the masthead is alt text on an empty page.
          test -f dist/brand/logo-mahjongyuk.png \
            || { echo "::error::the brand logo is missing from the build"; exit 1; }
          grep -q '/brand/logo-mahjongyuk.png' "dist${BUNDLE}" \
            || { echo "::error::the root no longer references the brand logo"; exit 1; }

          # Run 7. The locale bundles are imported, not fetched, so a build
          # that tree-shook one would ship an app whose language switch does
          # nothing - and every test would still pass, because the tests read
          # the source.
          grep -rq 'Kartunya sudah jadi' dist/assets/ \
            || { echo "::error::the build shipped without the Indonesian bundle"; exit 1; }
          grep -rq 'Score this hand' dist/assets/ \
            || { echo "::error::the build shipped without the English bundle"; exit 1; }

          echo "CNAME ok; /v1/ byte-identical; root ships ${BUNDLE}; /v3/ forwards; logo present; both locales present"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
