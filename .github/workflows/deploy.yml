name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for mahjongyuk.com.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The CNAME file is sacred, and /v1/ must serve the legacy calculator
      # unchanged, forever. Fail the deploy rather than ship a build that
      # breaks either one.
      - name: Verify deploy artifact
        run: |
          set -e
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing"; exit 1; }
          [ "$(tr -d '[:space:]' < dist/CNAME)" = "mahjongyuk.com" ] \
            || { echo "::error::dist/CNAME is not mahjongyuk.com"; exit 1; }
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          cmp public/v1/index.html dist/v1/index.html \
            || { echo "::error::/v1/ no longer matches the legacy calculator"; exit 1; }
          echo "CNAME ok, /v1/ byte-identical to the legacy calculator"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
