name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race for mahjongyuk.com.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Three things must hold on every deploy:
      #   1. the CNAME file is sacred - without it the domain breaks
      #   2. /v1/ serves the legacy calculator byte-for-byte, forever
      #   3. the root actually ships a working v2 bundle
      # The root itself is no longer pinned - since Run 2 it legitimately
      # changes. /v1/ is what stays frozen.
      - name: Verify deploy artifact
        run: |
          set -e
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing"; exit 1; }
          [ "$(tr -d '[:space:]' < dist/CNAME)" = "mahjongyuk.com" ] \
            || { echo "::error::dist/CNAME is not mahjongyuk.com"; exit 1; }

          cmp public/v1/index.html dist/v1/index.html \
            || { echo "::error::/v1/ no longer matches the legacy calculator"; exit 1; }

          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          BUNDLE=$(grep -o 'src="/assets/[^"]*\.js"' dist/index.html | head -1 | sed 's|src="||;s|"||')
          [ -n "$BUNDLE" ] \
            || { echo "::error::the root page references no JS bundle - v2 did not build"; exit 1; }
          test -f "dist${BUNDLE}" \
            || { echo "::error::the root page references ${BUNDLE}, which is not in the build"; exit 1; }

          test -f dist/app/index.html \
            || { echo "::error::the /app/ engine harness is missing"; exit 1; }

          echo "CNAME ok; /v1/ byte-identical; root ships ${BUNDLE}; /app/ present"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
